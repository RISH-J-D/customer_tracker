services:
  - type: web
    name: customer-tracker-api
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: tracker-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: tracker-db
    databaseName: tracker_db
    user: tracker_user
    plan: free
