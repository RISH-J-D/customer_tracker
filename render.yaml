# Live service (created manually, not via Blueprint): https://customer-tracker-nx2q.onrender.com
# The frontend runs on Vercel (frontend/vercel.json proxies /api here); Render also serves
# the prebuilt backend/frontend_dist as a fallback.
services:
  - type: web
    name: customer-tracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false # Render Postgres internal URL, entered when the Blueprint is created
      - key: CORS_ORIGINS
        value: "*"
