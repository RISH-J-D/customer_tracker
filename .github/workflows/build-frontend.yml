# Render serves the prebuilt frontend from backend/frontend_dist (render.yaml rootDir: backend)
# and its build step only installs Python packages. This workflow rebuilds that folder whenever
# frontend code changes on main and commits it back, which in turn triggers the Render deploy.
name: Build frontend for Render

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-frontend
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Replace backend/frontend_dist
        run: |
          rm -rf backend/frontend_dist
          cp -r frontend/dist backend/frontend_dist

      - name: Commit if changed
        run: |
          git add -A backend/frontend_dist
          if git diff --cached --quiet; then
            echo "frontend_dist already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: update backend/frontend_dist from ${GITHUB_SHA::7}"
          git push
